# Configuracion de calidad automatica. Ver estandar 02-stack.md seccion 7.
# Los comandos son: ruff format .  /  ruff check .

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "env", "*/migrations/*"]

[tool.ruff.lint]
# E,W pycodestyle · F pyflakes · I orden de imports · UP modernizacion
# B errores comunes · S seguridad (bandit)
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]            # assert: se usa en las pruebas

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"config/settings.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
